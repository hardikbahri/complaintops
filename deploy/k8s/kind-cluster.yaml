# A one-node Kubernetes cluster that runs inside Docker, for trying the manifests locally.
# Port 30080 inside the cluster (the Service's nodePort) is published on http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: complaintops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
