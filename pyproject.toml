[project]
name = "complaintops"
version = "0.1.0"
description = "Complaint triage: train, evaluate, gate, monitor, serve (Milestone 1), then agents (Milestone 2)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "evidently>=0.7.23",
    "langfuse>=4.18.0",
    "langgraph>=1.2.19",
    "matplotlib>=3.10.9",
    "mcp>=2.3.0",
    "mlflow>=3.17.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.23.2",
    "openai>=3.45.0",
    "optuna>=5.0.0",
    "pandas>=2.3.3,<3",  # Evidently 0.7.x does not import under pandas 3
    "peft>=0.21.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=25.0.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.14",
    "transformers>=5.20.2",
    "xgboost>=3.2.0",
]   # added in Step 1 with: uv add <packages>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaintops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

# On Windows, PyPI only has CPU-only torch. Take torch (and only torch) from the CUDA 12.6 index.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
